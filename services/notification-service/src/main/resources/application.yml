spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/family-finance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
          audiences: ${KEYCLOAK_AUDIENCE:account,family-finance-web}
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USER:notification_user}
    password: ${DB_PASSWORD:changeme_notification}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${familyfinance.kafka.enabled:false}

familyfinance:
  security:
    enabled: ${SECURITY_ENABLED:false}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      payment-events: payment.provider.events
      wallet-ledger-events: wallet.ledger.events
      budget-events: budget.domain.events
      expense-events: expense.domain.events
      household-events: household.domain.events
      family-events: family.domain.events

server:
  port: ${SERVER_PORT:8088}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html