spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/family-finance}
          audiences: ${KEYCLOAK_AUDIENCE:account,family-finance-web}
  application:
    name: household-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/household_db}
    username: ${DB_USER:household_user}
    password: ${DB_PASSWORD:changeme_household}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

familyfinance:
  security:
    enabled: ${SECURITY_ENABLED:false}
