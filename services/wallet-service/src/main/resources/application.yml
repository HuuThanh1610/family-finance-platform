spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/family-finance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
          audiences: ${KEYCLOAK_AUDIENCE:account,family-finance-web}
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${DB_USER:wallet_user}
    password: ${DB_PASSWORD:changeme_wallet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:wallet-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: ${familyfinance.kafka.enabled:false}

familyfinance:
  security:
    enabled: ${SECURITY_ENABLED:false}
  family-auth:
    enabled: ${FAMILY_AUTH_ENABLED:false}
  family-service:
    base-url: ${FAMILY_SERVICE_URL:http://localhost:8082}
  internal:
    api-key: ${INTERNAL_API_KEY:}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      payment-events: payment.provider.events
  outbox:
    poll-interval-ms: 2000

server:
  port: ${SERVER_PORT:8083}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
