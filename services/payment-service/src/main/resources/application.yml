spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/family-finance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
          audiences: ${KEYCLOAK_AUDIENCE:account,family-finance-web}
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD:changeme_payment}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: ${familyfinance.kafka.enabled:false}

familyfinance:
  security:
    enabled: ${SECURITY_ENABLED:false}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      payment-events: payment.provider.events
      wallet-ledger: wallet.ledger.events
  outbox:
    poll-interval-ms: 2000
  payment:
    provider:
      active: ${PAYMENT_PROVIDER:fake}
    recovery:
      webhook-poll-ms: 5000

server:
  port: ${SERVER_PORT:8084}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

momo:
  environment: ${MOMO_ENVIRONMENT:}
  partner-code: ${MOMO_PARTNER_CODE:}
  access-key: ${MOMO_ACCESS_KEY:}
  secret-key: ${MOMO_SECRET_KEY:}
  base-url: ${MOMO_BASE_URL:https://test-payment.momo.vn}
  redirect-url: ${MOMO_REDIRECT_URL:}
  ipn-url: ${MOMO_IPN_URL:}
