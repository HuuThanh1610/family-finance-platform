name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - profile-service
          - family-service
          - wallet-service
          - payment-service
          - budget-service
          - expense-service
          - household-service
          - notification-service
          - analytics-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test ${{ matrix.service }}
        run: mvn -B -f services/${{ matrix.service }}/pom.xml test

  # Dedicated PostgreSQL service — does not use Testcontainers / Docker-in-Docker.
  wallet-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet_db
          POSTGRES_USER: wallet_user
          POSTGRES_PASSWORD: wallet_it_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_user -d wallet_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WALLET_IT: "true"
      WALLET_IT_JDBC_URL: jdbc:postgresql://localhost:5432/wallet_db
      WALLET_IT_DB_USER: wallet_user
      WALLET_IT_DB_PASSWORD: wallet_it_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Wait for PostgreSQL
        run: |
          # Service healthcheck already gates readiness; confirm TCP accept on mapped port.
          for i in $(seq 1 30); do
            if (echo >/dev/tcp/localhost/5432) >/dev/null 2>&1; then
              echo "PostgreSQL port open"
              exit 0
            fi
            echo "waiting for postgres ($i)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Run wallet *IT (9 tests)
        run: mvn -B -f services/wallet-service/pom.xml test -Dtest='*IT'
      - name: Assert Surefire 9/0/0/0
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = sorted(Path("services/wallet-service/target/surefire-reports").glob("TEST-*.xml"))
          assert reports, "No Surefire XML reports found"
          tests = failures = errors = skipped = 0
          for path in reports:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
              print(f"{path.name}: tests={root.attrib.get('tests')} failures={root.attrib.get('failures')} errors={root.attrib.get('errors')} skipped={root.attrib.get('skipped')}")
          print(f"TOTAL tests={tests} failures={failures} errors={errors} skipped={skipped}")
          assert tests == 9, f"expected 9 tests, got {tests}"
          assert failures == 0 and errors == 0 and skipped == 0, "expected zero failures/errors/skipped"
          PY
