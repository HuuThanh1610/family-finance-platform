global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["profile-service:8081"]

  - job_name: family-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["family-service:8082"]

  - job_name: wallet-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["wallet-service:8083"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]

  - job_name: budget-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["budget-service:8085"]

  - job_name: expense-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["expense-service:8086"]

  - job_name: household-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["household-service:8087"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8088"]

  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["analytics-service:8089"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]