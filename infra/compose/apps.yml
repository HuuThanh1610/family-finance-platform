services:
  profile-service:
    build:
      context: ../../services/profile-service
    image: familyfinance/profile-service:0.0.1-SNAPSHOT
    container_name: ff-profile-service
    restart: unless-stopped
    profiles: ["full"]
    env_file:
      - ../../.env
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/profile_db
      DB_USER: ${PROFILE_DB_USER}
      DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/family-finance
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/family-finance/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  family-service:
