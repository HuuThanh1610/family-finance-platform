    container_name: ff-frontend
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
