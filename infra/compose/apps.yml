      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      family-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
      expense-service:
